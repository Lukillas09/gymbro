name: Reportar un error
description: Informar un comportamiento incorrecto de GymBro
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explicá qué ocurrió.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Indicá los pasos exactos.
      placeholder: |
        1. Abrir...
        2. Presionar...
        3. Observar...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Dispositivo
      placeholder: iPhone 15, Samsung A54, PC Windows...

  - type: input
    id: browser
    attributes:
      label: Navegador
      placeholder: Chrome, Safari, Edge...

  - type: textarea
    id: evidence
    attributes:
      label: Evidencia adicional
      description: Capturas, videos o mensajes de error.
